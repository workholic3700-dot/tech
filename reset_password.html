<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your RumCHUO password</title>
<style>
  body { font-family: system-ui, sans-serif; background: #f4f6f8; margin: 0;
         display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  .card { background: #fff; padding: 28px; border-radius: 12px; width: 100%;
          max-width: 380px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  h1 { font-size: 1.25rem; margin: 0 0 16px; }
  label { display: block; font-size: .85rem; margin: 12px 0 4px; }
  input { width: 100%; padding: 10px; border: 1px solid #ccd3da; border-radius: 8px;
          box-sizing: border-box; font-size: 1rem; }
  button { width: 100%; margin-top: 18px; padding: 11px; border: 0; border-radius: 8px;
           background: #1a5fb4; color: #fff; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  #msg { margin-top: 14px; font-size: .9rem; min-height: 1.2em; }
  .ok { color: #1b7f3b; } .err { color: #b3261e; }
</style>
</head>
<body>
<div class="card">
  <h1>Choose a new password</h1>
  <label for="pw">New password (at least 8 characters)</label>
  <input id="pw" type="password" minlength="8" autocomplete="new-password">
  <label for="pw2">Confirm new password</label>
  <input id="pw2" type="password" minlength="8" autocomplete="new-password">
  <button id="btn" type="button">Update password</button>
  <div id="msg"></div>
</div>
<script>
  const token = new URLSearchParams(location.search).get("token") || "";
  const msg = document.getElementById("msg");
  const btn = document.getElementById("btn");

  function show(text, ok) {
    msg.textContent = text;
    msg.className = ok ? "ok" : "err";
  }

  if (!token) show("This reset link is missing its token. Request a new one.", false);

  btn.addEventListener("click", async () => {
    const pw = document.getElementById("pw").value;
    const pw2 = document.getElementById("pw2").value;
    if (!token) return;
    if (pw.length < 8) return show("Password must be at least 8 characters.", false);
    if (pw !== pw2) return show("The two passwords do not match.", false);

    btn.disabled = true;
    try {
      const res = await fetch("/students/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token, new_password: pw })
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok) {
        show(data.message || "Password updated. You can now log in.", true);
      } else {
        const d = data.detail;
        show(typeof d === "string" ? d : "Could not reset the password.", false);
        btn.disabled = false;
      }
    } catch (e) {
      show("Network error. Please try again.", false);
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
